name: android

on:
  push:
    branches: [ "unity" ]
  pull_request:
    branches: [ "unity" ]

env:
  BUILD_TYPE: Release
  SOURCE_DATE_EPOCH: 0

jobs:
  build:
    name: ${{ matrix.platform.name }}
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: Android (arm64-v8a), artifact: "android-arm64", android_abi: "arm64-v8a", android_platform: 16 }
          - { name: Android (armeabi-v7a), artifact: "android-armv7", android_abi: "armeabi-v7a", android_platform: 16, flags: "-DANDROID_ARM_NEON=ON" }
          - { name: Android (x86), artifact: "android-x86", android_abi: "x86", android_platform: 16 }
          - { name: Android (x86_64), artifact: "android-x86_64", android_abi: "x86_64", android_platform: 16 }

    steps:
    - uses: actions/checkout@v4

    - name: Set SOURCE_DATE_EPOCH
      run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> $GITHUB_ENV

    - uses: nttld/setup-ndk@v1
      id: setup_ndk
      with:
        ndk-version: r23b

    - name: Configure CMake
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DANDROID_PLATFORM=${{ matrix.platform.android_platform }} \
          -DANDROID_ABI=${{ matrix.platform.android_abi }} \
          -DANDROID_STL=none \
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup_ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
          ${{ matrix.platform.flags }}

    - name: Build
      run: cmake --build build --config ${{env.BUILD_TYPE}}

    - name: Install
      run: cmake --install build --config ${{env.BUILD_TYPE}} --prefix dist

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.platform.artifact }}
        path: dist
