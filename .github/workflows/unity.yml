name: unity

on:
  push:
    branches: [ "unity" ]
  pull_request:
    branches: [ "unity" ]

env:
  BUILD_TYPE: Release
  SOURCE_DATE_EPOCH: 0

jobs:
  desktop:
    name: ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}

    defaults:
      run:
        shell: ${{ matrix.platform.shell }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: "Linux (GCC)", artifact: "linux-x64", os: ubuntu-22.04, shell: bash }
          - { name: "macOS (Clang)", artifact: "macos-universal", os: macos-14, shell: bash, flags: "-GXcode -DCMAKE_OSX_ARCHITECTURES='arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13" }
          - { name: "Windows (MSVC)", artifact: "windows-x64", os: windows-2022, shell: pwsh, flags: "-A x64 -DUSE_MSVC_STATIC_RUNTIME=ON" }
          - { name: "Windows (GCC)", artifact: "windows-x64-mingw", os: windows-2022, shell: 'msys2 {0}', msystem: mingw64, msys-env: mingw-w64-x86_64 }

    steps:
    - name: Set up MSYS2
      if: matrix.platform.shell == 'msys2 {0}'
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.platform.msystem }}
        install: >-
          ${{ matrix.platform.msys-env }}-gcc
          ${{ matrix.platform.msys-env }}-cmake
          ${{ matrix.platform.msys-env }}-ninja

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set SOURCE_DATE_EPOCH
      shell: bash
      run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> $GITHUB_ENV

    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} ${{ matrix.platform.flags }}

    - name: Build
      run: cmake --build build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}}

    - name: Install
      run: cmake --install build --config ${{env.BUILD_TYPE}} --prefix dist

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.platform.artifact }}
        path: dist

  android:
    name: ${{ matrix.platform.name }}
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: Android (arm64-v8a), artifact: "android-arm64", android_abi: "arm64-v8a", android_platform: 16 }
          - { name: Android (armeabi-v7a), artifact: "android-armv7", android_abi: "armeabi-v7a", android_platform: 16, flags: "-DANDROID_ARM_NEON=ON" }
          - { name: Android (x86), artifact: "android-x86", android_abi: "x86", android_platform: 16 }
          - { name: Android (x86_64), artifact: "android-x86_64", android_abi: "x86_64", android_platform: 16 }

    steps:
    - uses: actions/checkout@v4

    - name: Set SOURCE_DATE_EPOCH
      run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> $GITHUB_ENV

    - uses: nttld/setup-ndk@v1
      id: setup_ndk
      with:
        ndk-version: r23b

    - name: Configure CMake
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DANDROID_PLATFORM=${{ matrix.platform.android_platform }} \
          -DANDROID_ABI=${{ matrix.platform.android_abi }} \
          -DANDROID_STL=none \
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup_ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
          ${{ matrix.platform.flags }}

    - name: Build
      run: cmake --build build --config ${{env.BUILD_TYPE}}

    - name: Install
      run: cmake --install build --config ${{env.BUILD_TYPE}} --prefix dist

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.platform.artifact }}
        path: dist

  ios:
    name: iOS
    runs-on: macos-15
    env:
      ZERO_AR_DATE: 1

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.4'

    - name: Set SOURCE_DATE_EPOCH
      run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> $GITHUB_ENV

    - name: Configure CMake
      run: |
        cmake -S . -B build \
        -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
        -GXcode \
        -DCMAKE_INSTALL_PREFIX=${{github.workspace}}/dist \
        -DCMAKE_SYSTEM_NAME=iOS \
        "-DCMAKE_OSX_ARCHITECTURES=arm64" \
        -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
        -DCMAKE_XCODE_ATTRIBUTE_ONLY_ACTIVE_ARCH=NO \
        -DCMAKE_IOS_INSTALL_COMBINED=NO \
        -DCMAKE_XCODE_ATTRIBUTE_DEBUG_INFORMATION_FORMAT=dwarf

    - name: Build
      run: cmake --build build --config ${{env.BUILD_TYPE}}

    - name: Install
      run: cmake --build build --config ${{env.BUILD_TYPE}} --target install

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ios-arm64
        path: dist

  emscripten:
    name: Emscripten (wasm32)
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set SOURCE_DATE_EPOCH
      run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> $GITHUB_ENV

    - uses: mymindstorm/setup-emsdk@v14
      with:
        version: 3.1.8

    - name: Configure CMake
      run: emcmake cmake -S . -B build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build build --config ${{env.BUILD_TYPE}}

    - name: Install
      run: cmake --install build --config ${{env.BUILD_TYPE}} --prefix dist

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: emscripten-wasm
        path: dist
